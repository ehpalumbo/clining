name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    env:
      AWS_LC_SYS_PREBUILT_NASM: 1

    steps:
    - uses: actions/checkout@v4
    - name: Rustfmt
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings
    - name: Test
      run: cargo test
    - name: Build
      run: cargo build --release
